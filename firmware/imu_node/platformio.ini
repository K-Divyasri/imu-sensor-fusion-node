; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 921600
upload_speed = 921600

; Adafruit_MPU6050 needs Adafruit_Sensor (the same Unified Sensor
; interface project 13's BME280 library builds on) plus Adafruit_BusIO
; for the underlying I2C register transactions.
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO @ ^1.16.1

build_flags =
    -D CORE_DEBUG_LEVEL=3
